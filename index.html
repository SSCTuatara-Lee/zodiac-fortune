<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 星座运势 · 专业星象解析</title>
    <style>
        :root {
            --bg: #06060f;
            --card-bg: rgba(16, 16, 40, 0.9);
            --text: #d8d8f0;
            --text-dim: #8888b0;
            --gold: #f0c060;
            --gold-glow: rgba(240, 180, 60, 0.5);
            --accent: #9b7cfc;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(160, 120, 240, 0.3);
            --fire: #f87171;
            --earth: #68d391;
            --air: #fbbf24;
            --water: #60a5fa;
            --love: #f472b6;
            --career: #60a5fa;
            --wealth: #fbbf24;
            --health: #34d399;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Serif SC', 'STSong', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            color: var(--text);
            padding: 20px 0 60px;
        }

        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 0 16px;
            margin-top: 16px;
        }

        /* ── 头部 ── */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header .logo-icon {
            font-size: 52px;
            display: block;
            animation: float 3.5s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(180, 140, 240, 0.4));
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c4b5fd 0%, #f0c060 40%, #f9a8d4 70%, #c4b5fd 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .header .subtitle {
            font-size: 0.82rem;
            color: var(--text-dim);
            margin-top: 4px;
            letter-spacing: 2px;
        }

        /* ── 星象概览条 ── */
        .astro-bar {
            background: rgba(20, 20, 50, 0.7);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 16px;
            text-align: center;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .astro-bar .moon-phase {
            font-size: 1.8rem;
            animation: pulse-slow 3s ease-in-out infinite;
        }
        @keyframes pulse-slow {
            0%,
            100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }
        .astro-bar .astro-info {
            text-align: left;
        }
        .astro-bar .astro-title {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .astro-bar .astro-detail {
            font-size: 0.85rem;
            color: #c8c0f0;
            font-weight: 500;
        }
        .astro-bar .planet-tag {
            display: inline-block;
            background: rgba(160, 120, 240, 0.2);
            border: 1px solid rgba(160, 120, 240, 0.3);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 0.75rem;
            color: #c4b5fd;
            margin: 2px 3px;
            white-space: nowrap;
        }

        .status-bar {
            margin: 12px 0 16px;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d8d8f0;
            font-size: 0.86rem;
            text-align: center;
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── 星座网格 ── */
        .section-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .zodiac-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .zodiac-btn {
            background: rgba(22, 22, 45, 0.8);
            border: 1.5px solid transparent;
            border-radius: 14px;
            padding: 10px 4px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            color: #a0a0c0;
            font-size: 0.78rem;
            backdrop-filter: blur(8px);
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .zodiac-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            background: radial-gradient(circle at center, rgba(140, 100, 240, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.35s;
        }
        .zodiac-btn:hover {
            border-color: #7c6ff7;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(100, 60, 200, 0.35);
        }
        .zodiac-btn:hover::before {
            opacity: 1;
        }
        .zodiac-btn.active {
            border-color: var(--gold) !important;
            background: rgba(40, 25, 70, 0.9) !important;
            color: #fff !important;
            box-shadow: 0 0 35px var(--gold-glow) !important;
            animation: pulse-border 2.5s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%,
            100% {
                box-shadow: 0 0 25px var(--gold-glow);
            }
            50% {
                box-shadow: 0 0 50px rgba(240, 180, 60, 0.7);
            }
        }
        .zodiac-btn .emoji {
            font-size: 1.6rem;
            display: block;
            margin-bottom: 2px;
            position: relative;
            z-index: 1;
        }
        .zodiac-btn .name {
            font-size: 0.72rem;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        /* ── 生日行 ── */
        .birthday-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .birthday-row input[type="date"] {
            flex: 1;
            padding: 13px 16px;
            border-radius: 12px;
            border: 2px solid rgba(120, 100, 200, 0.35);
            background: rgba(16, 16, 40, 0.8);
            color: #e0e0ff;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }
        .birthday-row input[type="date"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(140, 100, 240, 0.2);
        }
        .birthday-row input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.75);
            cursor: pointer;
        }
        .birthday-row button {
            padding: 13px 20px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6d5df0, #9b7cfc);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.3s;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .birthday-row button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(100, 70, 220, 0.5);
        }

        /* ── 运势卡片 ── */
        .fortune-card {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 28px 22px;
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            display: none;
            animation: fadeInUp 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .fortune-card.visible {
            display: block;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 卡片头部 */
        .card-header {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .card-header .zodiac-big {
            font-size: 3.2rem;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
        }
        .card-header .zodiac-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        .card-header .element-badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .element-badge.fire {
            background: rgba(248, 113, 113, 0.2);
            color: #fca5a5;
        }
        .element-badge.earth {
            background: rgba(104, 211, 145, 0.2);
            color: #86efac;
        }
        .element-badge.air {
            background: rgba(251, 191, 36, 0.2);
            color: #fcd34d;
        }
        .element-badge.water {
            background: rgba(96, 165, 250, 0.2);
            color: #93c5fd;
        }

        /* 星级 */
        .stars-row {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin: 12px 0;
        }
        .stars-row .star {
            font-size: 1.5rem;
            transition: all 0.3s;
        }
        .stars-row .star.lit {
            color: var(--gold);
            text-shadow: 0 0 14px var(--gold-glow);
            animation: star-pop 0.4s ease-out;
        }
        .stars-row .star.dim {
            color: #3a3a55;
        }
        @keyframes star-pop {
            0% {
                transform: scale(1.6);
            }
            100% {
                transform: scale(1);
            }
        }

        /* 综合运势 */
        .overview-block {
            background: rgba(255, 255, 255, 0.025);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 3px solid var(--accent);
            line-height: 1.75;
            font-size: 0.92rem;
            color: #d0c8f0;
        }
        .overview-block .overview-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            margin-bottom: 6px;
            display: block;
        }

        /* 四宫格 */
        .aspects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .aspect-box {
            background: rgba(255, 255, 255, 0.025);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid var(--border-subtle);
            transition: all 0.3s;
        }
        .aspect-box:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
        }
        .aspect-box .aspect-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .aspect-box .aspect-icon {
            font-size: 1.4rem;
        }
        .aspect-box .aspect-label {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ccc;
        }
        .aspect-box .aspect-score {
            margin-left: auto;
            font-size: 0.7rem;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 10px;
        }
        .aspect-box .aspect-text {
            font-size: 0.84rem;
            line-height: 1.6;
            color: #c0c0d8;
        }
        .aspect-box.love {
            border-left: 3px solid var(--love);
        }
        .aspect-box.career {
            border-left: 3px solid var(--career);
        }
        .aspect-box.wealth {
            border-left: 3px solid var(--wealth);
        }
        .aspect-box.health {
            border-left: 3px solid var(--health);
        }

        /* 塔罗 */
        .tarot-block {
            background: linear-gradient(135deg, rgba(100, 60, 180, 0.12), rgba(60, 30, 100, 0.2));
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid rgba(160, 120, 220, 0.25);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .tarot-block::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(180, 140, 240, 0.08) 0%, transparent 60%);
            animation: tarot-glow 4s ease-in-out infinite;
        }
        @keyframes tarot-glow {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(5%, 3%);
            }
        }
        .tarot-block .tarot-icon {
            font-size: 2.6rem;
            position: relative;
            z-index: 1;
        }
        .tarot-block .tarot-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #e0d0ff;
            position: relative;
            z-index: 1;
            margin-top: 4px;
        }
        .tarot-block .tarot-position {
            font-size: 0.72rem;
            color: #a090d0;
            position: relative;
            z-index: 1;
            margin-top: 2px;
        }
        .tarot-block .tarot-meaning {
            font-size: 0.84rem;
            color: #c8b8f0;
            font-style: italic;
            position: relative;
            z-index: 1;
            margin-top: 8px;
            line-height: 1.6;
        }

        /* 幸运信息 */
        .lucky-strip {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .lucky-item {
            flex: 1;
            min-width: 80px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px 10px;
            text-align: center;
            border: 1px solid var(--border-subtle);
        }
        .lucky-item .lucky-icon {
            font-size: 1.2rem;
        }
        .lucky-item .lucky-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .lucky-item .lucky-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            margin-top: 2px;
        }
        .lucky-item .color-dot {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 5px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px currentColor;
        }

        /* 黄金时间 */
        .golden-time {
            text-align: center;
            font-size: 0.82rem;
            color: #c0b0e0;
            padding: 8px;
            background: rgba(240, 180, 60, 0.06);
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px dashed rgba(240, 180, 60, 0.2);
        }

        /* 箴言 */
        .motto-block {
            text-align: center;
            padding: 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            font-style: italic;
            font-size: 0.9rem;
            color: #b8a8e0;
            border: 1px solid var(--border-subtle);
            letter-spacing: 0.5px;
            line-height: 1.7;
        }
        .motto-block .motto-icon {
            font-size: 1.2rem;
            margin-right: 4px;
        }

        /* ── 响应式 ── */
        @media (max-width: 420px) {
            .zodiac-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .zodiac-btn {
                padding: 8px 2px;
                border-radius: 10px;
            }
            .zodiac-btn .emoji {
                font-size: 1.3rem;
            }
            .zodiac-btn .name {
                font-size: 0.68rem;
            }
            .aspects-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .fortune-card {
                padding: 20px 14px;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .tarot-block .tarot-icon {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="starCanvas"></canvas>

    <div class="main-container">
        <!-- 头部 -->
        <div class="header">
            <span class="logo-icon">🔮</span>
            <h1>星 座 运 势</h1>
            <p class="subtitle">✨ 每日星象 · 专业解析 ✨</p>
        </div>

        <!-- 今日星象概览 -->
        <div class="astro-bar" id="astroBar">
            <span class="moon-phase" id="moonPhaseIcon">🌓</span>
            <div class="astro-info">
                <div class="astro-title">今日星象</div>
                <div class="astro-detail" id="moonPhaseText">上弦月 · 能量攀升</div>
                <div id="planetTags"></div>
            </div>
        </div>

        <div class="status-bar" id="statusBar">AI 运势接口准备就绪。</div>

        <!-- 生日行 -->
        <div class="section-label">📅 查询你的星座</div>
        <div class="birthday-row">
            <input type="date" id="birthdayInput" placeholder="选择你的生日">
            <button onclick="findZodiacByBirthday()">🔍 查询</button>
        </div>

        <!-- 星座网格 -->
        <div class="section-label">✨ 或直接选择星座</div>
        <div class="zodiac-grid" id="zodiacGrid"></div>

        <!-- 运势卡片 -->
        <div class="fortune-card" id="fortuneCard">
            <div class="card-header">
                <div class="zodiac-big" id="cardEmoji"></div>
                <div class="zodiac-name" id="cardName"></div>
                <div class="element-badge" id="elementBadge"></div>
            </div>

            <div class="stars-row" id="starsRow"></div>

            <!-- 综合运势 -->
            <div class="overview-block">
                <span class="overview-label">🌌 综合运势</span>
                <div id="overviewText"></div>
            </div>

            <!-- 四宫格 -->
            <div class="aspects-grid">
                <div class="aspect-box love">
                    <div class="aspect-header">
                        <span class="aspect-icon">❤️</span>
                        <span class="aspect-label">爱情运</span>
                        <span class="aspect-score" id="loveScore"></span>
                    </div>
                    <div class="aspect-text" id="aspectLove"></div>
                </div>
                <div class="aspect-box career">
                    <div class="aspect-header">
                        <span class="aspect-icon">💼</span>
                        <span class="aspect-label">事业运</span>
                        <span class="aspect-score" id="careerScore"></span>
                    </div>
                    <div class="aspect-text" id="aspectCareer"></div>
                </div>
                <div class="aspect-box wealth">
                    <div class="aspect-header">
                        <span class="aspect-icon">💰</span>
                        <span class="aspect-label">财运</span>
                        <span class="aspect-score" id="wealthScore"></span>
                    </div>
                    <div class="aspect-text" id="aspectWealth"></div>
                </div>
                <div class="aspect-box health">
                    <div class="aspect-header">
                        <span class="aspect-icon">🌿</span>
                        <span class="aspect-label">健康运</span>
                        <span class="aspect-score" id="healthScore"></span>
                    </div>
                    <div class="aspect-text" id="aspectHealth"></div>
                </div>
            </div>

            <!-- 塔罗指引 -->
            <div class="tarot-block">
                <div class="tarot-icon" id="tarotIcon"></div>
                <div class="tarot-name" id="tarotName"></div>
                <div class="tarot-position" id="tarotPosition"></div>
                <div class="tarot-meaning" id="tarotMeaning"></div>
            </div>

            <!-- 幸运信息 -->
            <div class="lucky-strip">
                <div class="lucky-item">
                    <div class="lucky-icon">🔢</div>
                    <div class="lucky-label">幸运数字</div>
                    <div class="lucky-value" id="luckyNumber"></div>
                </div>
                <div class="lucky-item">
                    <div class="lucky-icon">🎨</div>
                    <div class="lucky-label">幸运色</div>
                    <div class="lucky-value" id="luckyColor"></div>
                </div>
                <div class="lucky-item">
                    <div class="lucky-icon">⭐</div>
                    <div class="lucky-label">幸运星座</div>
                    <div class="lucky-value" id="luckyZodiac"></div>
                </div>
                <div class="lucky-item">
                    <div class="lucky-icon">💎</div>
                    <div class="lucky-label">幸运石</div>
                    <div class="lucky-value" id="luckyStone"></div>
                </div>
            </div>

            <!-- 黄金时间 -->
            <div class="golden-time" id="goldenTime"></div>

            <!-- 箴言 -->
            <div class="motto-block">
                <span class="motto-icon">💫</span>
                <span id="mottoText"></span>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════
        //  星空背景
        // ═══════════════════════════════════════
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const STAR_COUNT = 200;

        function resizeCanvas() { canvas.width = window.innerWidth;

            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 2.3 + 0.4,
                    speed: Math.random() * 0.018 + 0.004,

                    opacity: Math.random(),
                    hue: 220 + Math.random() * 40,
                });
            }

        function drawStars(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const grad = ctx.createRadialGradient(canvas.width * 0.35, canvas.height * 0.35, 0, canvas.width * 0.5,
                canvas.height * 0.5, canvas.width * 0.75);
            grad.addColorStop(0, '#140d30');
            grad.addColorStop(0.5, '#080818');
            grad.addColorStop(1, '#030310');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (const s of stars) {
                const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * s.speed + s.offset));
                ctx.fillStyle = `hsla(${s.hue},60%,80%,${alpha.toFixed(2)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
                if (s.r > 1.3 && alpha > 0.7) {

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r * 2.8, 0, Math.PI * 2);

                }
            }

                const mx = Math.random() * canvas.width;
                const my = Math.random() * canvas.height * 0.4;
                const grad2 = ctx.createLinearGradient(mx, my, mx - 100, my + 50);
                grad2.addColorStop(0, 'rgba(255,255,255,0.7)');
                grad2.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.strokeStyle = grad2;
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(mx, my);
                ctx.lineTo(mx - 100, my + 50);
                ctx.stroke();
            }

                meaning: '今天你看到的不一定是真相。月亮的光芒会扭曲事物的轮廓——相信直觉而非表象，有些路需要在黑暗中摸索。', position: '正位' },
            { id: 19, name: '太阳', icon: '☀️', keywords: '成功、活力、喜悦',
                meaning: '今天是属于你的晴好天气！太阳牌带来的能量照亮一切——自信地展现自己，你的光芒不会被忽视。', position: '正位' },
            { id: 20, name: '审判', icon: '📯', keywords: '觉醒、召唤、重生',
                meaning: '一个来自内心深处的召唤正在响起。今天适合回顾过去、清算旧账、然后带着全新的觉知走向下一阶段。', position: '正位' },
            { id: 21, name: '世界', icon: '🌍', keywords: '完成、圆满、成就',
                meaning: '一个重要的周期即将圆满。你走过的每一步都有意义——今天适合庆祝你的成长，也为下一个循环做好准备。', position: '正位' },
        ];

        // 颜色库
        const colors = [
            { name: '烈焰红', hex: '#ef4444' }, { name: '星空紫', hex: '#8b5cf6' },
            { name: '深海蓝', hex: '#3b82f6' }, { name: '翡翠绿', hex: '#10b981' },
            { name: '琥珀金', hex: '#f59e0b' }, { name: '玫瑰粉', hex: '#f472b6' },
            { name: '月光银', hex: '#cbd5e1' }, { name: '蜜橘橙', hex: '#f97316' },
            { name: '薰衣紫', hex: '#a855f7' }, { name: '薄荷绿', hex: '#22c55e' },
            { name: '珊瑚色', hex: '#fb7185' }, { name: '天青蓝', hex: '#06b6d4' },
        ];

        // 石头库
        const stones = [
            '紫水晶', '黄水晶', '月光石', '黑曜石', '红玛瑙', '海蓝宝',
            '祖母绿', '石榴石', '蛋白石', '蓝宝石', '琥珀', '孔雀石',
            '粉晶', '虎眼石', '青金石', '绿松石',
        ];

        // ═══════════════════════════════════════
        //  工具函数
        // ═══════════════════════════════════════

        function seededRandom(seed) { let s = seed; return function() { s = (s * 16807 + 0) % 2147483647; return (s - 1) /
                2147483646; }; }

        function getTodaySeed(zodiacIndex) {
            const now = new Date();
            const str = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}-${zodiacIndex}`;
            let hash = 0;
            for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0; }
            return Math.abs(hash);
        }

        function pick(arr, rand) { return arr[Math.floor(rand() * arr.length)]; }

        function scoreEmoji(score) {
            if (score >= 4.5) return '🔥 极佳';
            if (score >= 3.8) return '✨ 良好';
            if (score >= 3.0) return '👍 平稳';
            return '🌥️ 注意';
        }

        // ── 月相计算（近似）──
        function getMoonPhase() {
            // 以 2024年1月11日（新月）为基准，周期29.53天
            const newMoonRef = new Date(2024, 0, 11).getTime();
            const now = Date.now();
            const diffDays = (now - newMoonRef) / (1000 * 60 * 60 * 24);
            const cycleDay = diffDays % 29.53;
            const phaseIdx = Math.floor((cycleDay / 29.53) * 8) % 8;
            const phases = [
                { icon: '🌑', text: '新月 · 播种意图', energy: '内省' },
                { icon: '🌒', text: '蛾眉月 · 蓄势待发', energy: '酝酿' },
                { icon: '🌓', text: '上弦月 · 能量攀升', energy: '行动' },
                { icon: '🌔', text: '盈凸月 · 接近圆满', energy: '推进' },
                { icon: '🌕', text: '满月 · 能量巅峰', energy: '释放' },
                { icon: '🌖', text: '亏凸月 · 感恩回顾', energy: '沉淀' },
                { icon: '🌗', text: '下弦月 · 放下清理', energy: '净化' },
                { icon: '🌘', text: '残月 · 休养生息', energy: '修复' },
            ];
            return phases[phaseIdx];
        }

        // ── 行星焦点 ──
        function getPlanetaryFocus(rand) {
            const planets = [
                { name: '太阳', aspect: '三分木星', effect: '自信与扩张的能量充盈' },
                { name: '月亮', aspect: '过境社交宫', effect: '情绪敏感度提升' },
                { name: '水星', aspect: '六分金星', effect: '沟通表达格外流畅' },
                { name: '金星', aspect: '合相海王星', effect: '浪漫与创造力高涨' },
                { name: '火星', aspect: '六分木星', effect: '行动力与勇气倍增' },
                { name: '木星', aspect: '照耀事业宫', effect: '机遇与贵人运上升' },
                { name: '土星', aspect: '三合太阳', effect: '自律带来丰厚回报' },
                { name: '天王星', aspect: '四分金星', effect: '意料之外的际遇' },
            ];
            return pick(planets, rand);
        }

        // ═══════════════════════════════════════
        //  生成完整运势
        // ═══════════════════════════════════════
        function generateFortune(zodiacIndex) {
            const seed = getTodaySeed(zodiacIndex);
            const rand = seededRandom(seed);
            const zodiac = zodiacData[zodiacIndex];

            const overallStars = Math.round((rand() * 2.5 + 2.5) * 10) / 10; // 2.5-5.0
            const loveStars = Math.round((rand() * 2.5 + 2.5) * 10) / 10;
            const careerStars = Math.round((rand() * 2.5 + 2.5) * 10) / 10;
            const wealthStars = Math.round((rand() * 2.5 + 2.5) * 10) / 10;
            const healthStars = Math.round((rand() * 2.5 + 2.5) * 10) / 10;

            const moonPhase = getMoonPhase();
            const planet = getPlanetaryFocus(rand);
            const tarot = pick(tarotDeck, rand);
            const luckyColor = pick(colors, rand);
            const luckyStone = pick(stones, rand);
            const luckyNum = Math.floor(rand() * 80) + 1;
            const luckyZodiac = zodiacData[Math.floor(rand() * 12)];
            const goldenHour = Math.floor(rand() * 8) + 9; // 9-16点之间

            return {
                zodiac,
                moonPhase,
                planet,
                overallStars,
                loveStars,
                careerStars,
                wealthStars,
                healthStars,
                overall: pick(overallPool, rand),
                love: pick(lovePool, rand),
                career: pick(careerPool, rand),
                wealth: pick(wealthPool, rand),
                health: pick(healthPool, rand),
                tarot,
                luckyColor,
                luckyStone,
                luckyNumber: luckyNum,
                luckyZodiac,
                goldenHour,
                motto: pick(mottoPool, rand),
            };
        }

        // ═══════════════════════════════════════
        //  渲染
        // ═══════════════════════════════════════

        function renderZodiacGrid() {
            const grid = document.getElementById('zodiacGrid');
            grid.innerHTML = zodiacData.map((z, i) => `
            <button class="zodiac-btn" data-index="${i}" onclick="selectZodiac(${i})">
              <span class="emoji">${z.emoji}</span>
              <span class="name">${z.name}</span>
            </button>
          `).join('');
        }

        function renderStars(count) {
            const fullStars = Math.floor(count);
            const hasHalf = count - fullStars >= 0.3;
            let html = '';
            for (let i = 0; i < 5; i++) {
                if (i < fullStars) html += '<span class="star lit">★</span>';
                else if (i === fullStars && hasHalf) html += '<span class="star lit">☆</span>';
                else html += '<span class="star dim">★</span>';
            }
            return html + ` <span style="color:#f0c060;font-size:0.85rem;margin-left:6px;">${count}</span>`;
        }

        function parseJSONFromText(text) {
            const start = text.indexOf('{');
            const end = text.lastIndexOf('}');
            if (start === -1 || end === -1) {
                throw new Error('No JSON object found in response');
            }
            return JSON.parse(text.slice(start, end + 1));
        }

        async function fetchFortuneFromAI(index, birthday) {
            const statusEl = document.getElementById('statusBar');
            statusEl.textContent = '正在调用 DeepSeek AI 生成运势，请稍候...';
            try {
                const response = await fetch('/api/fortune', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zodiacIndex: index, birthday }),
                });

                const payload = await response.json().catch(() => ({ error: '无法解析 API 返回内容' }));
                if (!response.ok) {
                    const errorMessage = payload.error || payload.message || `HTTP ${response.status}`;
                    throw new Error(errorMessage);
                }

                if (!payload.data) {
                    throw new Error(payload.error || 'API 未返回有效数据');
                }

                statusEl.textContent = 'AI 运势加载完成。';
                return payload.data;
            } catch (error) {
                const message = error?.message || '未知错误';
                statusEl.textContent = `AI 接口调用失败：${message}，已回退到本地运势逻辑。`;
                console.warn('AI fortune error:', error);
                return generateFortune(index);
            }
        }

        async function selectZodiac(index) {
            document.querySelectorAll('.zodiac-btn').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`.zodiac-btn[data-index="${index}"]`);
            if (btn) btn.classList.add('active');

            const birthdayValue = document.getElementById('birthdayInput').value;
            const fortune = await fetchFortuneFromAI(index, birthdayValue);

            // 星象概览
            const moonPhase = fortune.moonPhase || getMoonPhase();
            const planet = fortune.planet || getPlanetaryFocus(seededRandom(getTodaySeed(index)));
            document.getElementById('moonPhaseIcon').textContent = moonPhase.icon;
            document.getElementById('moonPhaseText').textContent = moonPhase.text;
            document.getElementById('planetTags').innerHTML = `
            <span class="planet-tag">${planet.name}</span>
            <span class="planet-tag">${planet.aspect}</span>
            <span style="font-size:0.72rem;color:#8888b0;margin-left:4px;">${planet.effect}</span>
          `;

            // 运势卡片
            const card = document.getElementById('fortuneCard');
            card.classList.remove('visible');
            void card.offsetWidth;
            card.classList.add('visible');

            const zodiac = zodiacData[index];
            document.getElementById('cardEmoji').textContent = zodiac.emoji;
            document.getElementById('cardName').textContent = zodiac.name;
            const badge = document.getElementById('elementBadge');
            badge.textContent = zodiac.elementCN + ' · 守护星：' + zodiac.ruler;
            badge.className = 'element-badge ' + zodiac.element;

            document.getElementById('starsRow').innerHTML = renderStars(fortune.overallStars || 4.0);
            document.getElementById('overviewText').textContent = fortune.overall || fortune.overallText || '暂无综合运势。';

            document.getElementById('loveScore').textContent = fortune.loveScore || scoreEmoji(fortune.loveStars || 4);
            document.getElementById('aspectLove').textContent = fortune.love || '暂无爱情运势。';
            document.getElementById('careerScore').textContent = fortune.careerScore || scoreEmoji(fortune.careerStars || 4);
            document.getElementById('aspectCareer').textContent = fortune.career || '暂无事业运势。';
            document.getElementById('wealthScore').textContent = fortune.wealthScore || scoreEmoji(fortune.wealthStars || 4);
            document.getElementById('aspectWealth').textContent = fortune.wealth || '暂无财运。';
            document.getElementById('healthScore').textContent = fortune.healthScore || scoreEmoji(fortune.healthStars || 4);
            document.getElementById('aspectHealth').textContent = fortune.health || '暂无健康建议。';

            document.getElementById('tarotIcon').textContent = fortune.tarotIcon || fortune.tarot?.icon || '🔮';
            document.getElementById('tarotName').textContent = fortune.tarotName || fortune.tarot?.name || '未知塔罗';
            document.getElementById('tarotPosition').textContent = fortune.tarotPosition || fortune.tarot?.position || '';
            document.getElementById('tarotMeaning').textContent = fortune.tarotMeaning || fortune.tarot?.meaning || '';

            if (fortune.luckyColor && !fortune.luckyColor.hex) {
                document.getElementById('luckyColor').textContent = fortune.luckyColor;
            } else {
                document.getElementById('luckyColor').innerHTML = `<span class="color-dot" style="background:${fortune.luckyColor?.hex || '#8b5cf6'};color:${fortune.luckyColor?.hex || '#8b5cf6'};"></span>${fortune.luckyColor?.name || fortune.luckyColor || '星空紫'}`;
            }
            document.getElementById('luckyNumber').textContent = fortune.luckyNumber || '—';
            document.getElementById('luckyZodiac').textContent = fortune.luckyZodiac || zodiac.emoji + ' ' + zodiac.name;
            document.getElementById('luckyStone').textContent = fortune.luckyStone || zodiac.stone;

            document.getElementById('goldenTime').innerHTML = fortune.goldenTime || '⏰ 今日黄金时段：10:00 - 12:00';
            document.getElementById('mottoText').textContent = fortune.motto || fortune.mottoText || '愿星光引导你前行。';
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function findZodiacByBirthday() {
            const input = document.getElementById('birthdayInput');
            const value = input.value;
            if (!value) { alert('请先选择生日日期 📅'); return; }
            const parts = value.split('-');
            const mmdd = parts[1] + parts[2];
            let index = -1;
            for (let i = 0; i < zodiacData.length; i++) {
                const z = zodiacData[i];
                if (z.startMD > z.endMD) { if (mmdd >= z.startMD || mmdd <= z.endMD) { index = i; break; } } else { if (
                        mmdd >= z.startMD && mmdd <= z.endMD) { index = i; break; } }
            }
            if (index === -1) index = 0;
            selectZodiac(index);
        }

        function init() {
            renderZodiacGrid();
            const today = new Date();
            document.getElementById('birthdayInput').value =
                `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            const todayIdx = today.getDate() % 12;
            selectZodiac(todayIdx);
        }
        init();
    </script>
